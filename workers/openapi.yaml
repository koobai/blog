openapi: 3.1.0
info:
  title: Jingzhe Worker APIs
  version: 0.3.0
  description: Five independently deployed Workers. Example hosts must be replaced by each installation.
tags:
  - name: Publisher
  - name: Drafts
  - name: Comments
  - name: Likes
  - name: Activity Sync
paths:
  /api/github:
    get:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Proxy a GET to the configured GitHub repository
      security: [{ AdminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GitHubTarget'
      responses:
        '200': { description: GitHub response }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Target repository rejected }
    put:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Create or update repository content
      security: [{ AdminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GitHubTarget'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: GitHub response }
        '201': { description: GitHub response }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/upload:
    post:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Upload an image to the configured R2 bucket
      security: [{ AdminToken: [] }]
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string, pattern: '^(memos|article|apps)/' }
      requestBody:
        required: true
        content:
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [success, url]
                properties:
                  success: { type: boolean, const: true }
                  url: { type: string, format: uri }
        '400': { description: Invalid path }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/app/laodao/detail:
    get:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Read one legacy laodao Markdown file for editing
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentPath' }]
      responses:
        '200': { description: Laodao detail compatible with the existing App }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/app/laodao/publish:
    post:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Create or update laodao while preserving the deployed App contract
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaodaoPublish' }
      responses:
        '200': { $ref: '#/components/responses/PublishResult' }
        '400': { description: Invalid content or path }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/app/laodao/delete:
    post:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Idempotently delete one laodao Markdown file
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPathInput' }
      responses:
        '200': { $ref: '#/components/responses/PublishResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/app/zouguo/detail:
    get:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Read one standalone zouguo Markdown file for editing
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentPath' }]
      responses:
        '200': { description: Markdown, path and GitHub SHA }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/app/zouguo/publish:
    post:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Idempotently create or update standalone zouguo Markdown
      description: New records require requestId or the Idempotency-Key header. Repeating the same request never creates a second file.
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZouguoPublish' }
      responses:
        '200': { $ref: '#/components/responses/PublishResult' }
        '400': { description: Invalid content, place or path }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/app/zouguo/delete:
    post:
      tags: [Publisher]
      servers: [{ url: "https://publisher.example.org" }]
      summary: Idempotently delete one standalone zouguo Markdown file
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPathInput' }
      responses:
        '200': { $ref: '#/components/responses/PublishResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/drafts:
    get:
      tags: [Drafts]
      servers: [{ url: "https://drafts.example.org" }]
      summary: List cloud drafts
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Draft list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Draft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Drafts]
      servers: [{ url: "https://drafts.example.org" }]
      summary: Create or replace a cloud draft
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid draft }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Drafts]
      servers: [{ url: "https://drafts.example.org" }]
      summary: Delete a cloud draft
      security: [{ AdminToken: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/comments:
    get:
      tags: [Comments]
      servers: [{ url: "https://comments.example.org" }]
      summary: List public comments without email addresses
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string, pattern: '^/' }
      responses:
        '200':
          description: Public comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicComment' }
    delete:
      tags: [Comments]
      servers: [{ url: "https://comments.example.org" }]
      summary: Delete a comment with the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, password]
              properties:
                id: { type: integer }
                password: { type: string, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/comments/submit:
    post:
      tags: [Comments]
      servers: [{ url: "https://comments.example.org" }]
      summary: Submit a comment
      security: [{ Turnstile: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid comment }
        '403': { description: Turnstile or anti-spam rejection }
  /api/verify:
    post:
      tags: [Comments]
      servers: [{ url: "https://comments.example.org" }]
      summary: Verify the comment administrator password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/likes:
    get:
      tags: [Likes]
      servers: [{ url: "https://likes.example.org" }]
      summary: Get like counts
      responses:
        '200':
          description: Counts by page path
          content:
            application/json:
              schema:
                type: object
                required: [counts, myLikes]
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer, minimum: 0 }
                  myLikes:
                    type: array
                    items: { type: string }
  /api/likes/submit:
    post:
      tags: [Likes]
      servers: [{ url: "https://likes.example.org" }]
      summary: Submit one like
      security: [{ Turnstile: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, pattern: '^/' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { description: Turnstile rejection }
        '409': { description: Already liked }
  /v1/activities/sync:
    post:
      tags: [Activity Sync]
      servers: [{ url: "https://activity-sync.example.org" }]
      summary: Merge source-neutral activity facts into the configured repository
      description: >-
        snapshot atomically replaces one authoritative complete source; delta applies explicit
        upserts and deletes and is required for device-local views. Identity is source plus
        external_id. Non-public route statuses must not include a polyline.
      security: [{ SyncToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/data/exercise-sync-v1.schema.json'
      responses:
        '200':
          description: Synchronized, including no-change requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivitySyncResponse' }
        '400': { $ref: '#/components/responses/ActivitySyncError' }
        '401': { $ref: '#/components/responses/ActivitySyncError' }
        '403': { $ref: '#/components/responses/ActivitySyncError' }
        '409': { $ref: '#/components/responses/ActivitySyncError' }
        '413': { $ref: '#/components/responses/ActivitySyncError' }
        '500': { $ref: '#/components/responses/ActivitySyncError' }
        '502': { $ref: '#/components/responses/ActivitySyncError' }
components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: x-admin-token
    Turnstile:
      type: apiKey
      in: header
      name: CF-Turnstile-Response
    SyncToken:
      type: http
      scheme: bearer
  parameters:
    GitHubTarget:
      in: header
      name: x-target-url
      required: true
      schema: { type: string, format: uri }
    ContentPath:
      in: query
      name: path
      required: true
      schema: { type: string, pattern: '^content/(laodao|zouguo)/' }
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success: { type: boolean, const: true }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    PublishResult:
      description: GitHub content mutation result; changed is false for an idempotent replay or already-deleted path
      content:
        application/json:
          schema:
            type: object
            required: [success, path, changed]
            properties:
              success: { type: boolean, const: true }
              path: { type: string }
              sha: { type: string }
              changed: { type: boolean }
    ActivitySyncError:
      description: Activity Sync rejected or could not safely persist the request
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details:
                    type: array
                    items: { type: string }
  schemas:
    ActivitySyncResponse:
      type: object
      required: [success, changed, schema_version, source, mode, request_id, counts, commit]
      properties:
        success: { type: boolean, const: true }
        changed: { type: boolean }
        schema_version: { type: integer, const: 1 }
        source: { type: string }
        mode: { enum: [snapshot, delta] }
        request_id: { type: [string, 'null'] }
        counts:
          type: object
          required: [created, updated, deleted, total]
          properties:
            created: { type: integer, minimum: 0 }
            updated: { type: integer, minimum: 0 }
            deleted: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        commit:
          type: [object, 'null']
          properties:
            sha: { type: [string, 'null'] }
            url: { type: [string, 'null'], format: uri }
    Draft:
      type: object
      required: [id, kind, date, payload, content, images, locationName, lat, lng, url]
      properties:
        id: { type: string }
        kind: { enum: [laodao, zouguo] }
        date: { type: string }
        payload: { type: object, additionalProperties: true }
        content: { type: string }
        images: { type: array, items: { type: string } }
        locationName: { type: string }
        lat: { type: number }
        lng: { type: number }
        url: { type: string }
    DraftInput:
      type: object
      required: [id]
      properties:
        id: { type: [string, integer] }
        kind: { enum: [laodao, zouguo], default: laodao }
        payload: { type: object, additionalProperties: true }
        content: { type: string, maxLength: 200000 }
        location_name: { type: string, maxLength: 100 }
        lat: { type: number }
        lng: { type: number }
    ContentPathInput:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: '^content/(laodao|zouguo)/' }
    LaodaoPublish:
      type: object
      required: [content, date]
      properties:
        content: { type: string, maxLength: 200000 }
        images: { type: array, maxItems: 20, items: { type: string, format: uri } }
        locationName: { type: string }
        lat: { type: number }
        lng: { type: number }
        date: { type: string, format: date-time }
        device: { type: string }
        syncToZouguo: { type: boolean, default: false }
        occurredAt: { type: string, format: date-time }
        place: { $ref: '#/components/schemas/ZouguoPlace' }
        path: { type: string }
        sha: { type: string }
    ZouguoPublish:
      type: object
      required: [content, occurredAt, images, place]
      properties:
        requestId: { type: string, pattern: '^[a-z0-9][a-z0-9._:-]{0,199}$' }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 200000 }
        occurredAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        images: { type: array, maxItems: 20, items: { type: string, format: uri } }
        place: { $ref: '#/components/schemas/ZouguoPlace' }
        path: { type: string, pattern: '^content/zouguo/' }
    ZouguoPlace:
      type: object
      required: [id, name, longitude, latitude, precision, privacy, countryCode]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9._:-]{0,199}$' }
        name: { type: string, maxLength: 200 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        precision: { enum: [exact, poi, locality, region, approximate] }
        privacy: { enum: [public, reduced] }
        country: { type: string }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        region: { type: string }
        regionCode: { type: string }
        locality: { type: string }
        localityCode: { type: string }
        provider: { type: string }
        providerId: { type: string }
    PublicComment:
      type: object
      required: [id, url, author, content, created_at, avatar_hash]
      properties:
        id: { type: integer }
        url: { type: string }
        author: { type: string }
        website: { type: [string, 'null'] }
        content: { type: string }
        parent_id: { type: [integer, 'null'] }
        created_at: { type: string }
        avatar_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
      additionalProperties: false
    CommentInput:
      type: object
      required: [url, author, email, content]
      properties:
        url: { type: string, pattern: '^/' }
        author: { type: string, maxLength: 10 }
        email: { type: string, format: email, maxLength: 30, writeOnly: true }
        website: { type: string, maxLength: 30 }
        content: { type: string, maxLength: 500 }
        parent_id: { type: [integer, string, 'null'] }
