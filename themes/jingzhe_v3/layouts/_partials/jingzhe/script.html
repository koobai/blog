{{- $resource := resources.Get .path -}}
{{- with .targetPath -}}
  {{- $resource = resources.Copy . $resource -}}
{{- end -}}
{{- if not hugo.IsServer -}}
  {{- $resource = $resource | minify | fingerprint -}}
{{- end -}}
<script src="{{ $resource.RelPermalink }}"{{ if .defer }} defer{{ end }}></script>
