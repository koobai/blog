name: Generate AI Insights

on:
  # 🚀 核心：增量触发机制！只有当你从本地 push 了 activities.json 的更新时，才会触发此工作流
  push:
    paths:
      - 'assets/activities.json' 
  # 保留手动点击运行的按钮，以防万一需要手动修复
  workflow_dispatch:

jobs:
  enrich-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 如果你有配置 PAT 最好用 PAT，如果没有，默认的 github.token 也能用于基础推送
          token: ${{ secrets.PAT || github.token }} 
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run AI Insights Script
        env:
          # 🔑 从 GitHub Secrets 提取 Cloudflare 凭证喂给脚本
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        # 确保这里的文件名与你上传的 Python 脚本文件名一致
        run: python generate_ai_insights.py 

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/
          # 检查是否有 AI 写入的新内容，如果有，则自动 commit 并 push 回仓库
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generate AI insights & monthly report" && git push)