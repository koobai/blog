name: Generate Activity Insights

permissions:
  contents: write

concurrency:
  group: activity-insights-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'assets/activities.json'
  workflow_dispatch:

jobs:
  sync:
    # AI 文案提交会再次触发 push；使用固定标记跳过，避免工作流自循环。
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[activity-insights]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate activity insights
        id: insights
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_AI_MODEL: '@cf/meta/llama-4-scout-17b-16e-instruct'
          PYTHONUNBUFFERED: '1'
        run: python3 fetch_strava.py

      - name: Commit generated files
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -- assets/activities.json assets/monthly_insights.json
          if [ -f assets/activity_ai_meta.json ]; then
            git add -- assets/activity_ai_meta.json
          fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "[activity-insights] update generated copy"
            git push
          fi
