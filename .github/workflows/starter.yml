name: Build Core Starter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build privacy-safe Core archive
        run: python tools/jingzhe.py starter --output jingzhe-core-starter.zip

      - name: Upload Starter artifact
        uses: actions/upload-artifact@v4
        with:
          name: jingzhe-core-starter
          path: jingzhe-core-starter.zip
          if-no-files-found: error
