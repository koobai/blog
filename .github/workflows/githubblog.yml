name: Githubblog

permissions:
  contents: read

concurrency:
  group: githubblog-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main  # 监听源码主分支

jobs:
  deploy:
    # App 推送的是尚未补齐展示字段的原始运动数据；等待 AI 工作流提交最终 JSON 后再部署。
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Auto-sync Dongqilai')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Validate Production Contracts
        id: check
        run: python3 tools/jingzhe.py check --skip-tests

      - name: Build
        id: build
        run: hugo --minify --panicOnWarning

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=koobaiblog --commit-dirty=true

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 惊蛰站点发布"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "| --- | --- |"
            echo "| Production/Core 门禁 | ${{ steps.check.outcome }} |"
            echo "| Hugo 严格构建 | ${{ steps.build.outcome }} |"
            echo "| Cloudflare Pages | ${{ steps.deploy.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
