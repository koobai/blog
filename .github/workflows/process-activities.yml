name: Process Activities and Monthly Reports

permissions:
  contents: read

concurrency:
  group: monthly-coach-${{ github.ref }}
  cancel-in-progress: true

on:
  # GitHub cron 使用 UTC。以下三组时间对应北京时间每月 1 日 04:00；
  # 二月同时覆盖 28/29 日，并由第一步按北京时间再次校验。
  schedule:
    - cron: '0 20 31 1,3,5,7,8,10,12 *'
    - cron: '0 20 30 4,6,9,11 *'
    - cron: '0 20 28-29 2 *'
    # UTC 15 日 20:00 = 北京时间每月 16 日 04:00，检查是否生成月中报告。
    - cron: '0 20 15 * *'
  # Activity Sync Gateway 写入原始事实时触发；生成产物不会再次触发本工作流。
  push:
    branches:
      - main
    paths:
      - 'data/exercise/activities.json'
  # 保留手动触发，方便你随时在网页端手动运行
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Beijing Monthly Window
        id: monthly_window
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          beijing_day="$(TZ=Asia/Shanghai date +%d)"
          if [[ "$event_name" == "push" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$event_name" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$beijing_day" == "01" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$beijing_day" == "16" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.monthly_window.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          # 必须保留独立 PAT：它推送的处理结果需要继续触发部署工作流。
          token: ${{ secrets.PAT }}
          # push、schedule 与网页手动触发都处理同一条生产主链。
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: steps.monthly_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.monthly_window.outputs.should_run == 'true'
        run: pip install requests

      - name: Verify Exercise Processing and Monthly Reports
        id: verify
        if: steps.monthly_window.outputs.should_run == 'true'
        run: >-
          python -m unittest
          tests.test_exercise_contract
          tests.test_exercise_sync_contract
          tests.test_activity_store
          tests.test_process_activities
          tests.test_monthly_coach

      - name: Materialize Activities and Optional Monthly Reports
        id: process_data
        if: steps.monthly_window.outputs.should_run == 'true'
        env:
          # DeepSeek 只接收程序汇总后的月度证据，不接收轨迹与坐标。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 公开地理编码服务要求请求标识应用和联系页面。
          NOMINATIM_USER_AGENT: KoobaiExerciseBlog/1.0 (https://koobai.com/exercise/)
          NOMINATIM_REFERER: https://koobai.com/exercise/
        run: python process_activities.py

      - name: Commit Processed Assets
        id: commit
        if: steps.monthly_window.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/data/exercise/activities.json assets/data/exercise/monthly-insights.json
          if git diff --staged --quiet; then
            echo "ACTIVITY_HAS_CHANGES=false" >> "$GITHUB_ENV"
            echo "ACTIVITY_CHANGED_FILES=none" >> "$GITHUB_ENV"
            echo "ACTIVITY_PUSH_RESULT=no_changes" >> "$GITHUB_ENV"
          else
            echo "ACTIVITY_HAS_CHANGES=true" >> "$GITHUB_ENV"
            changed_files="$(git diff --staged --name-only | tr '\n' ',' | sed 's/,$//')"
            echo "ACTIVITY_CHANGED_FILES=$changed_files" >> "$GITHUB_ENV"
            input_blob="$(git rev-parse HEAD:data/exercise/activities.json)"
            git commit -m "🤖 Auto-generate monthly coaching report"

            # 普通文章可能在处理期间推进 main。原始事实未变时安全 rebase；
            # 原始事实已经更新时让位给该次推送触发的新运行，不发布过期产物。
            for attempt in 1 2 3; do
              git fetch origin main:refs/remotes/origin/main
              remote_blob="$(git rev-parse origin/main:data/exercise/activities.json)"
              if [[ "$remote_blob" != "$input_blob" ]]; then
                echo "ACTIVITY_PUSH_RESULT=superseded_by_new_facts" >> "$GITHUB_ENV"
                exit 0
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "ACTIVITY_PUSH_RESULT=rebase_conflict" >> "$GITHUB_ENV"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "ACTIVITY_PUSH_RESULT=pushed" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            echo "ACTIVITY_PUSH_RESULT=push_failed" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 运动处理与月报"
            echo ""
            echo "| 项目 | 结果 |"
            echo "| --- | --- |"
            echo "| 触发方式 | ${{ github.event_name }} |"
            echo "| 输入提交 | ${{ github.sha }} |"
            echo "| 北京时间窗口 | ${{ steps.monthly_window.outputs.should_run || 'unknown' }} |"
            echo "| 契约测试 | ${{ steps.verify.outcome }} |"
            echo "| 数据处理 | ${{ steps.process_data.outcome }} |"
            echo "| 数据变化 | ${ACTIVITY_HAS_CHANGES:-unknown} |"
            echo "| 变化文件 | ${ACTIVITY_CHANGED_FILES:-unknown} |"
            echo "| 推送结果 | ${ACTIVITY_PUSH_RESULT:-unknown} |"
            echo "| 提交步骤 | ${{ steps.commit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
