name: Process Activities and Monthly Reports

concurrency:
  group: monthly-coach-${{ github.ref }}
  cancel-in-progress: true

on:
  # GitHub cron 使用 UTC。以下三组时间对应北京时间每月 1 日 04:00；
  # 二月同时覆盖 28/29 日，并由第一步按北京时间再次校验。
  schedule:
    - cron: '0 20 31 1,3,5,7,8,10,12 *'
    - cron: '0 20 30 4,6,9,11 *'
    - cron: '0 20 28-29 2 *'
    # UTC 15 日 20:00 = 北京时间每月 16 日 04:00，检查是否生成月中报告。
    - cron: '0 20 15 * *'
  # App 同步运动数据时触发；仅修改处理代码不会自动调用月报 API。
  push:
    paths:
      - 'assets/activities.json'
  # 保留手动触发，方便你随时在网页端手动运行
  workflow_dispatch:

jobs:
  process:
    # 月报写回会再次触发 push；跳过自动生成提交，避免工作流自循环。
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Auto-generate monthly coaching report')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Beijing Monthly Window
        id: monthly_window
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          beijing_day="$(TZ=Asia/Shanghai date +%d)"
          if [[ "$event_name" == "push" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$event_name" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$beijing_day" == "01" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$beijing_day" == "16" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.monthly_window.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }} 
          fetch-depth: 0

      - name: Set up Python
        if: steps.monthly_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.monthly_window.outputs.should_run == 'true'
        run: pip install requests

      - name: Verify Exercise Processing and Monthly Reports
        id: verify
        if: steps.monthly_window.outputs.should_run == 'true'
        run: python -m unittest tests.test_exercise_contract tests.test_process_activities tests.test_monthly_coach

      - name: Process Activities and Reports
        id: process_data
        if: steps.monthly_window.outputs.should_run == 'true'
        env:
          # DeepSeek 只接收程序汇总后的月度证据，不接收轨迹与坐标。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 公开地理编码服务要求请求标识应用和联系页面。
          NOMINATIM_USER_AGENT: KoobaiExerciseBlog/1.0 (https://koobai.com/exercise/)
          NOMINATIM_REFERER: https://koobai.com/exercise/
        run: python process_activities.py

      - name: Commit and Push changes
        id: commit
        if: steps.monthly_window.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/
          if git diff --staged --quiet; then
            echo "ACTIVITY_HAS_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo "ACTIVITY_HAS_CHANGES=true" >> "$GITHUB_ENV"
            git commit -m "🤖 Auto-generate monthly coaching report"
            git push
          fi

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 运动处理与月报"
            echo ""
            echo "| 项目 | 结果 |"
            echo "| --- | --- |"
            echo "| 北京时间窗口 | ${{ steps.monthly_window.outputs.should_run || 'unknown' }} |"
            echo "| 契约测试 | ${{ steps.verify.outcome }} |"
            echo "| 数据处理 | ${{ steps.process_data.outcome }} |"
            echo "| 数据变化 | ${ACTIVITY_HAS_CHANGES:-unknown} |"
            echo "| 提交推送 | ${{ steps.commit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
